<title>无双 · 虎牢关</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0908;color:#f0e6d2;
  font-family:"PingFang SC","Hiragino Sans GB","Songti SC",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;cursor:default}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
#vig{position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 48%,transparent 42%,rgba(0,0,0,.55) 100%);
  mix-blend-mode:multiply;z-index:2}
#hurt{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;
  box-shadow:inset 0 0 160px 30px rgba(180,20,14,.85);transition:opacity .12s}
#grain{position:fixed;inset:0;pointer-events:none;z-index:3;opacity:.055;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;opacity:0;transition:opacity .6s}
#hud.on{opacity:1}

/* ---------- top bar ---------- */
#top{position:absolute;top:22px;left:0;right:0;text-align:center;
  text-shadow:0 2px 10px rgba(0,0,0,.9)}
#stage{font-size:15px;letter-spacing:8px;opacity:.82}
#stage b{color:#e8c37a;font-weight:600}
#ko{margin-top:4px;font-size:13px;letter-spacing:3px;opacity:.75}
#ko b{font-size:26px;color:#fff;letter-spacing:1px;vertical-align:-2px;margin:0 4px;
  font-variant-numeric:tabular-nums}
#timer{position:absolute;top:24px;right:34px;font-size:22px;letter-spacing:2px;
  font-variant-numeric:tabular-nums;opacity:.85;text-shadow:0 2px 8px #000}

/* ---------- boss bar ---------- */
#boss{position:absolute;top:96px;left:50%;transform:translateX(-50%);
  width:min(620px,72vw);opacity:0;transition:opacity .4s}
#boss.on{opacity:1}
#boss .nm{text-align:center;font-size:15px;letter-spacing:6px;color:#e8c37a;margin-bottom:6px;
  text-shadow:0 2px 8px #000}
#boss .bar{height:9px;background:rgba(0,0,0,.55);border:1px solid rgba(232,195,122,.35);
  position:relative;overflow:hidden;box-shadow:0 2px 14px rgba(0,0,0,.6)}
#boss .bar i{position:absolute;inset:0;width:100%;transform-origin:left;
  background:linear-gradient(90deg,#8e1f16,#d8452f 60%,#f0a05a);transition:transform .18s}
#boss .bar u{position:absolute;inset:0;width:100%;transform-origin:left;
  background:rgba(255,240,210,.35);transition:transform .7s .15s}

/* ---------- player ---------- */
#pl{position:absolute;left:38px;bottom:34px;width:min(330px,42vw)}
#pl .row{display:flex;align-items:flex-end;gap:12px}
#face{width:52px;height:52px;border:1px solid rgba(232,195,122,.5);flex:none;
  background:linear-gradient(160deg,#2a1b14,#120c09);position:relative;overflow:hidden}
#face canvas{width:100%;height:100%;display:block}
#bars{flex:1}
#nm{font-size:14px;letter-spacing:4px;color:#e8c37a;margin-bottom:5px;text-shadow:0 2px 6px #000}
.bar{height:11px;background:rgba(0,0,0,.6);border:1px solid rgba(255,255,255,.16);
  position:relative;overflow:hidden;margin-bottom:6px}
.bar i{position:absolute;inset:0;transform-origin:left;transition:transform .16s}
#hpF{background:linear-gradient(90deg,#7d1a12,#d8452f 70%,#ff8a5c)}
#hpB{background:rgba(255,235,200,.45);transition:transform .8s .12s}
#musouF{background:linear-gradient(90deg,#1d4f7a,#3f9fd8 60%,#a8e4ff)}
#musou.full #musouF{background:linear-gradient(90deg,#c9a227,#ffe9a3 60%,#fff);
  animation:pulse 1s infinite}
@keyframes pulse{50%{filter:brightness(1.6)}}
.bar span{position:absolute;right:4px;top:-1px;font-size:9px;letter-spacing:2px;opacity:.7}

/* ---------- combo ---------- */
#combo{position:absolute;right:44px;bottom:44px;text-align:right;opacity:0;
  transition:opacity .25s;text-shadow:0 3px 14px rgba(0,0,0,.9)}
#combo.on{opacity:1}
#comboN{font-size:64px;line-height:.86;font-weight:800;font-style:italic;
  font-variant-numeric:tabular-nums;color:#fff;letter-spacing:-2px}
#comboN small{font-size:20px;letter-spacing:3px;font-style:normal;opacity:.8;margin-left:6px}
#rank{font-size:26px;letter-spacing:4px;color:#e8c37a;font-weight:700}

/* ---------- musou flash ---------- */
#mflash{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;
  background:radial-gradient(ellipse at 50% 55%,rgba(90,170,255,.12),rgba(20,40,90,.42) 70%,rgba(0,0,0,.6));
  transition:opacity .25s}
#mflash.on{opacity:1}

/* ---------- damage numbers ---------- */
#dmg{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.dn{position:absolute;font-weight:800;font-size:20px;color:#fff;letter-spacing:1px;
  text-shadow:0 2px 0 #5a0f08,0 0 12px rgba(0,0,0,.9);will-change:transform,opacity;
  font-variant-numeric:tabular-nums}
.dn.crit{color:#ffd76a;font-size:27px}
.dn.player{color:#ff6a52}

/* ---------- banner text ---------- */
#call{position:fixed;left:0;right:0;top:32%;text-align:center;z-index:7;pointer-events:none;
  opacity:0;transition:opacity .3s}
#call.on{opacity:1}
#call .big{font-size:40px;letter-spacing:14px;font-weight:800;color:#fff;
  text-shadow:0 0 26px rgba(0,0,0,.9),0 4px 0 rgba(0,0,0,.5)}
#call .sub{font-size:15px;letter-spacing:8px;color:#e8c37a;margin-top:8px}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  background:radial-gradient(ellipse at 50% 45%,rgba(24,16,11,.62),rgba(5,4,3,.90) 72%);
  transition:opacity .5s;backdrop-filter:blur(2px)}
.screen.hide{opacity:0;pointer-events:none}
#title h1{font-size:clamp(44px,8vw,96px);letter-spacing:.16em;font-weight:800;
  color:#f6ead2;text-shadow:0 0 40px rgba(200,50,42,.5),0 6px 0 rgba(0,0,0,.4);line-height:1}
#title h1 em{font-style:normal;color:#c8322a}
#title .sub{margin-top:14px;font-size:14px;letter-spacing:9px;opacity:.7}
#title .keys{margin-top:34px;display:grid;grid-template-columns:auto auto;gap:8px 22px;
  font-size:13px;letter-spacing:2px;opacity:.82;text-align:left}
#title .keys b{color:#e8c37a;font-weight:600;display:inline-block;min-width:112px}
#title .go{margin-top:38px;font-size:16px;letter-spacing:8px;color:#e8c37a;
  animation:blink 1.8s infinite}
@keyframes blink{50%{opacity:.25}}
#result h2{font-size:clamp(38px,6vw,68px);letter-spacing:.2em;font-weight:800}
#result .stat{margin-top:22px;font-size:14px;letter-spacing:4px;opacity:.8;line-height:2}
#result .stat b{color:#e8c37a;font-size:20px;margin:0 6px}
#load{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:#0a0908;font-size:13px;letter-spacing:6px;opacity:.9;transition:opacity .5s}
#load.hide{opacity:0;pointer-events:none}
@media (max-width:700px){#comboN{font-size:44px}#pl{left:16px;bottom:16px;width:56vw}}
</style>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { Pass, FullScreenQuad } from 'three/addons/postprocessing/Pass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   0. 基础工具
   ============================================================ */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (a, b, l, dt) => lerp(a, b, 1 - Math.exp(-l * dt));
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = n => (Math.random() * n) | 0;
const pick = a => a[(Math.random() * a.length) | 0];
const smooth = t => t * t * (3 - 2 * t);
function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function angTo(from, to, maxStep) { const d = angDiff(to, from); return from + clamp(d, -maxStep, maxStep); }

const $ = s => document.querySelector(s);
const canvas = $('#c');

/* ============================================================
   1. 渲染器 / 场景 / 后期
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', stencil: false });
let PR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NoToneMapping; // The final HDR pass owns the only tone curve.
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.info.autoReset = false;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const MAXANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x8a7862, 0.0085);

const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, 0.1, 900);
camera.position.set(0, 4, 12);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
for (const rt of [composer.renderTarget1, composer.renderTarget2]) {
  rt.depthTexture = new THREE.DepthTexture(innerWidth * PR, innerHeight * PR, THREE.UnsignedIntType);
}
/* One logical atmosphere pass, two draws: half-resolution integration + depth-aware reconstruction.
   Scene depth is used directly: no extra scene or normal prepass. All radiance stays half-float. */
class BattlefieldAtmosphere extends Pass {
  constructor() {
    super(); this.samples = 8; this.volumetrics = true;
    this.target = new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, depthBuffer: false });
    this.target.texture.minFilter=this.target.texture.magFilter=THREE.NearestFilter;
    this.uniforms = {
      tDepth: { value: null }, invProjection: { value: camera.projectionMatrixInverse },
      cameraWorld: { value: camera.matrixWorld }, cameraPos: { value: camera.position },
      pixel: { value: new THREE.Vector2(1/innerWidth,1/innerHeight) },
      sunScreen: { value: new THREE.Vector3() }, uAO: { value: 8 }, uRays: { value: 1 }
    };
    const vertexShader = `varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`;
    this.integrate = new THREE.ShaderMaterial({ uniforms: this.uniforms, vertexShader, depthTest: false, depthWrite: false,
      fragmentShader: `precision highp float;
        varying vec2 vUv;uniform sampler2D tDepth;uniform mat4 invProjection,cameraWorld;
        uniform vec3 cameraPos,sunScreen;uniform vec2 pixel;uniform float uAO,uRays;
        vec3 viewPos(vec2 uv,float d){vec4 p=invProjection*vec4(uv*2.-1.,d*2.-1.,1.);return p.xyz/p.w;}
        void main(){float depth=texture2D(tDepth,vUv).x;vec3 view=viewPos(vUv,depth);
          vec3 world=(cameraWorld*vec4(view,1.)).xyz;float distanceToCamera=length(view);
          float occ=0.;float radius=clamp(80./max(2.,-view.z),2.,18.);
          for(int i=0;i<8;i++){if(float(i)>=uAO)break;
            float angle=float(i)*2.399963;vec2 uv=vUv+vec2(cos(angle),sin(angle))*pixel*radius;
            float d=texture2D(tDepth,uv).x;vec3 q=viewPos(uv,d);
            float delta=q.z-view.z;
            occ+=smoothstep(.035,.20,delta)*(1.-smoothstep(.25,1.4,abs(delta)));
          }
          float ao=depth<.9999?1.-occ/max(uAO,1.)*.34:1.;
          // Integrate exp(-height/1.5) along the camera ray. Dense only below 1.5 m.
          float h0=max(cameraPos.y,0.),h1=max(world.y,0.);
          float dh=(h1-h0)/1.5;
          float heightIntegral=abs(dh)<.01?exp(-h0/1.5):(exp(-h0/1.5)-exp(-h1/1.5))/dh;
          float fog=depth<.9999?1.-exp(-distanceToCamera*.007*heightIntegral):0.;
          float rays=0.;vec2 delta=(sunScreen.xy-vUv)/16.;vec2 uv=vUv;
          for(int i=0;i<16;i++){uv+=delta;
            float d=texture2D(tDepth,clamp(uv,vec2(.001),vec2(.999))).x;
            float sun=exp(-dot(uv-sunScreen.xy,uv-sunScreen.xy)*140.);
            rays+=step(.9997,d)*sun*(1.-float(i)/20.);
          }
          rays*=uRays*step(0.,sunScreen.z)*.011;
          gl_FragColor=vec4(ao,fog,rays,min(distanceToCamera/150.,1.));
        }` });
    this.combine = new THREE.ShaderMaterial({ vertexShader, depthTest: false, depthWrite: false,
      uniforms: { tDiffuse: { value: null }, tAtmosphere: { value: this.target.texture }, tDepth: { value: null },
        pixel: this.uniforms.pixel, invProjection: this.uniforms.invProjection },
      fragmentShader: `precision highp float;varying vec2 vUv;
        uniform sampler2D tDiffuse,tAtmosphere,tDepth;uniform vec2 pixel;uniform mat4 invProjection;
        float distAt(vec2 uv){float d=texture2D(tDepth,uv).x;vec4 p=invProjection*vec4(uv*2.-1.,d*2.-1.,1.);return min(length(p.xyz/p.w)/150.,1.);}
        void main(){float d=distAt(vUv);vec4 sum=vec4(0.);float total=0.;
          for(int i=0;i<5;i++){vec2 o=vec2(0.);if(i==1)o=vec2(2.,0.);if(i==2)o=vec2(-2.,0.);if(i==3)o=vec2(0.,2.);if(i==4)o=vec2(0.,-2.);
            vec4 a=texture2D(tAtmosphere,vUv+pixel*o);float w=exp(-abs(a.a-d)*180.);sum+=a*w;total+=w;}
          vec3 atmosphere=total>.01?sum.rgb/total:vec3(1.,0.,0.);vec3 c=texture2D(tDiffuse,vUv).rgb;
          c*=atmosphere.r;c=mix(c,vec3(.34,.29,.22),atmosphere.g*.26);
          c+=vec3(1.,.77,.44)*atmosphere.b;gl_FragColor=vec4(c,1.);
        }` });
    this.quad = new FullScreenQuad(this.integrate);
  }
  setSize(w,h) { this.target.setSize(Math.ceil(w/2),Math.ceil(h/2)); this.uniforms.pixel.value.set(1/w,1/h); }
  render(renderer,writeBuffer,readBuffer) {
    this.uniforms.tDepth.value=readBuffer.depthTexture;
    this.uniforms.uAO.value=this.samples;this.uniforms.uRays.value=this.volumetrics?1:0;
    this.uniforms.sunScreen.value.copy(camera.position).addScaledVector(SUN_DIR,500).project(camera);
    const p=this.uniforms.sunScreen.value;p.x=p.x*.5+.5;p.y=p.y*.5+.5;p.z=camera.getWorldDirection(new THREE.Vector3()).dot(SUN_DIR);
    renderer.setRenderTarget(this.target);this.quad.material=this.integrate;this.quad.render(renderer);
    this.combine.uniforms.tDiffuse.value=readBuffer.texture;this.combine.uniforms.tDepth.value=readBuffer.depthTexture;
    renderer.setRenderTarget(this.renderToScreen?null:writeBuffer);this.quad.material=this.combine;this.quad.render(renderer);
  }
}
const atmosphere = new BattlefieldAtmosphere(); composer.addPass(atmosphere);
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth * 0.5, innerHeight * 0.5), 0.24, 0.58, 1.35);
composer.addPass(bloom);

/* 最终 pass：ACES 色调映射 + 曝光 + 对比/饱和 + 分离色调 + 暗角，一次全屏完成 */
const FinalShader = {
  uniforms: {
    tDiffuse: { value: null },
    uExposure: { value: 1.06 },
    uContrast: { value: 1.09 },
    uSat: { value: 0.94 },
    uWarm: { value: 0.028 },
    uVig: { value: 0.07 }
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse;
    uniform float uExposure, uContrast, uSat, uWarm, uVig;
    varying vec2 vUv;
    vec3 aces(vec3 x){
      const float a = 2.51, b = 0.03, c = 2.43, d = 0.59, e = 0.14;
      return clamp((x * (a * x + b)) / (x * (c * x + d) + e), 0.0, 1.0);
    }
    vec3 toSRGB(vec3 c){
      return mix(c * 12.92, 1.055 * pow(max(c, vec3(0.0)), vec3(1.0 / 2.4)) - 0.055, step(vec3(0.0031308), c));
    }
    void main(){
      vec3 col = texture2D(tDiffuse, vUv).rgb * uExposure;
      float l0 = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col += 0.035 * (1.0 - smoothstep(0.0, 0.10, l0));
      col = aces(col);
      col = clamp((col - 0.5) * uContrast + 0.5, 0.0, 1.0);
      float l = dot(col, vec3(0.2126, 0.7152, 0.0722));
      col = mix(vec3(l), col, uSat);
      col += uWarm * vec3(1.0, 0.58, 0.18) * smoothstep(0.30, 1.0, l);
      col -= uWarm * 0.6 * vec3(0.10, 0.32, 0.62) * (1.0 - smoothstep(0.0, 0.42, l));
      vec2 d = vUv - 0.5;
      col *= clamp(1.0 - dot(d, d) * uVig * 2.2, 0.0, 1.0);
      gl_FragColor = vec4(toSRGB(col), 1.0);
    }`
};
const gradePass = new ShaderPass(FinalShader);
gradePass.renderToScreen = true;
composer.addPass(gradePass);
composer.setPixelRatio(PR);
composer.setSize(innerWidth, innerHeight);
/* 环境光照（程序化 IBL，让金属不黑） */
let iblAudit=null;
function makeEnvTexture() {
  // Linear HDR radiance, not a display-referred picture. The disc uses SUN_DIR.
  const W = 1024, H = 512, data = new Float32Array(W * H * 4);
  const dir = new THREE.Vector3(-.55, .25, -.80).normalize();
  const top = new THREE.Color(0x6489b1), horizon = new THREE.Color(0xc6c7bd);
  const earth = new THREE.Color(0x766047), sunColor = new THREE.Color(0xffdcae);
  const c = new THREE.Color();
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const phi = (x + .5) / W * TAU, theta = (y + .5) / H * Math.PI;
    const dy = -Math.cos(theta), dx = -Math.sin(theta) * Math.cos(phi), dz = -Math.sin(theta) * Math.sin(phi);
    c.copy(dy > 0 ? horizon : earth).lerp(dy > 0 ? top : earth, Math.pow(Math.abs(dy), .55));
    const alignment = Math.max(0, dx * dir.x + dy * dir.y + dz * dir.z);

/* Bake world transforms + vertex AO once; one batch per compatible material, no draw groups. */
const staticBatches=[];
{
  scene.updateMatrixWorld(true);
  const groups=new Map(),remove=[];
  scene.traverse(mesh=>{
    if(!mesh.isMesh||mesh.isInstancedMesh||mesh===ground||mesh===sky||flags.some(f=>f.mesh===mesh)||mesh.material.transparent)return;
    const key=mesh.material.uuid+'_'+mesh.castShadow+'_'+mesh.receiveShadow;
    if(!groups.has(key))groups.set(key,{material:mesh.material,cast:mesh.castShadow,receive:mesh.receiveShadow,geometries:[]});
    const source=mesh.geometry;source.computeBoundingBox();
    const geometry=source.index?source.toNonIndexed():source.clone();
    const pos=geometry.getAttribute('position'),normal=geometry.getAttribute('normal'),colors=new Float32Array(pos.count*3);
    const min=source.boundingBox.min.y,height=Math.max(.01,source.boundingBox.max.y-min);
    for(let i=0;i<pos.count;i++){
      const floor=Math.exp(-(pos.getY(i)-min)/height*4.);
      const ao=clamp(.94+normal.getY(i)*.055-floor*.15,.68,1.);
      colors[i*3]=colors[i*3+1]=colors[i*3+2]=ao;
    }
    geometry.setAttribute('color',new THREE.BufferAttribute(colors,3));
    // Normalize attribute sets for boxes, cones and poles before merging.
    for(const name of Object.keys(geometry.attributes))if(!['position','normal','uv','color'].includes(name))geometry.deleteAttribute(name);
    if(!geometry.getAttribute('uv'))geometry.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(pos.count*2),2));
    if(mesh.material.clearcoat>.1){
      const size=source.boundingBox.getSize(new THREE.Vector3()),axis=size.x>size.y&&size.x>size.z?0:size.y>size.z?1:2;
      const uv=geometry.attributes.uv;
      for(let i=0;i<pos.count;i++){
        const across=axis===0?(Math.abs(normal.getY(i))>.5?2:1):axis===1?(Math.abs(normal.getX(i))>.5?2:0):(Math.abs(normal.getY(i))>.5?0:1);
        uv.setXY(i,pos.getComponent(i,across)*2,pos.getComponent(i,axis)*.5);
      }
    }
    geometry.applyMatrix4(mesh.matrixWorld);
    if(mesh.material.userData.worldMasonry){
      const uv=geometry.attributes.uv;
      for(let i=0;i<pos.count;i++){
        const nx=Math.abs(normal.getX(i)),ny=Math.abs(normal.getY(i)),nz=Math.abs(normal.getZ(i));
        uv.setXY(i,(nz>nx?pos.getX(i):pos.getZ(i))*.25,(ny>.6?pos.getX(i):pos.getY(i))*.25);
      }
    }
    groups.get(key).geometries.push(geometry);remove.push(mesh);
  });
  for(const group of groups.values()){
    const material=group.material.clone();material.vertexColors=true;
    if(material.isMeshStandardMaterial)material.envMapIntensity=material.metalness>=.9?1.25:material.roughness>=.75?.35:.65;
    const mesh=new THREE.Mesh(mergeGeometries(group.geometries,false),material);
    mesh.name='static-AO-batch';mesh.castShadow=group.cast;mesh.receiveShadow=group.receive;
    staticBatches.push(mesh);scene.add(mesh);for(const geometry of group.geometries)geometry.dispose();
  }
  for(const mesh of remove)mesh.removeFromParent();
}

/* ============================================================
   5. 音频引擎（全部程序化合成）
   ============================================================ */
const SFX = (() => {
  let ctx = null, master = null, comp = null, noise = null, musicGain = null;
  const ready = () => !!ctx;

  function init() {
    if (ctx) return;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 22; comp.ratio.value = 7;
    comp.attack.value = 0.003; comp.release.value = 0.24;
    master = ctx.createGain(); master.gain.value = 0.62;
    master.connect(comp); comp.connect(ctx.destination);
    musicGain = ctx.createGain(); musicGain.gain.value = 0.34; musicGain.connect(master);

    const len = ctx.sampleRate * 2;
    noise = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = noise.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2 + w * 0.35; }
  }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }
  function t() { return ctx.currentTime; }
  function src(buf, dur, rate = 1) {
    const s = ctx.createBufferSource(); s.buffer = buf; s.playbackRate.value = rate;
    s.loop = true; s.start(t(), rand(0, 1.5)); s.stop(t() + dur + 0.05); return s;
  }
  function env(node, a, d, peak = 1) {
    const g = ctx.createGain(); const n = t();
    g.gain.setValueAtTime(0.0001, n);
    g.gain.linearRampToValueAtTime(peak, n + a);
    g.gain.exponentialRampToValueAtTime(0.0001, n + a + d);
    node.connect(g); g.connect(master); return g;
  }
  function noiseHit(dur, f0, f1, q, peak, type = 'bandpass') {
    if (!ctx) return;
    const s = src(noise, dur, rand(.85, 1.15));
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q;
    const n = t(); f.frequency.setValueAtTime(f0, n); f.frequency.exponentialRampToValueAtTime(f1, n + dur);
    s.connect(f); env(f, 0.004, dur, peak);
  }
  function tone(freq, dur, type = 'sine', peak = .3, bend = 0) {
    if (!ctx) return;
    const o = ctx.createOscillator(); o.type = type;
    const n = t(); o.frequency.setValueAtTime(freq, n);
    if (bend) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * bend), n + dur);
    o.connect(env(o, 0.005, dur, peak)); o.start(n); o.stop(n + dur + .05);
  }

  const api = {
    init, resume, ready,
    get ctx() { return ctx; },
    get music() { return musicGain; },

    /* 挥空 */
    swing(heavy = false) {
      if (!ctx) return;
      noiseHit(heavy ? 0.3 : 0.18, heavy ? 380 : 900, heavy ? 1400 : 2600, 1.1, heavy ? .5 : .3);
      tone(heavy ? 90 : 150, .12, 'sine', .1, .6);
    },
    /* 命中肉体 */
    hit(heavy = false) {
      if (!ctx) return;
      noiseHit(0.09, 2200, 300, .8, .55);
      tone(heavy ? 70 : 110, heavy ? .26 : .15, 'sine', heavy ? .85 : .5, .35);
      tone(rand(150, 210), .06, 'square', .12, .5);
    },
    /* 兵器交击 */
    clang() {
      if (!ctx) return;
      [1, 2.41, 3.77, 5.13].forEach((m, i) => tone(rand(1200, 1800) * m * .5, .5 - i * .09, 'triangle', .13 / (i + 1), .98));
      noiseHit(.12, 5200, 2200, 3, .3);
    },
    /* 落地 / 重击 */
    thud() {
      if (!ctx) return;
      tone(58, .34, 'sine', .9, .42);
      noiseHit(.22, 700, 120, .7, .42, 'lowpass');
    },
    /* 战鼓 */
    drum(vel = 1) {
      if (!ctx) return;
      const o = ctx.createOscillator(); o.type = 'sine';
      const n = t(); o.frequency.setValueAtTime(150, n); o.frequency.exponentialRampToValueAtTime(46, n + .22);
      const g = ctx.createGain(); g.gain.setValueAtTime(0.0001, n);
      g.gain.linearRampToValueAtTime(.55 * vel, n + .006); g.gain.exponentialRampToValueAtTime(.0001, n + .34);
      o.connect(g); g.connect(musicGain); o.start(n); o.stop(n + .4);
      noiseHit(.05, 1600, 500, 1, .10 * vel);
    },
    /* 铜锣 */
    gong() {
      if (!ctx) return;
      const base = rand(120, 150);
      [1, 2.02, 2.98, 4.21, 5.4].forEach((m, i) => {
        const o = ctx.createOscillator(); o.type = 'sine'; o.frequency.value = base * m * rand(.995, 1.005);
        const g = ctx.createGain(); const n = t();
        g.gain.setValueAtTime(0.0001, n); g.gain.linearRampToValueAtTime(.26 / (i * .7 + 1), n + .01);
        g.gain.exponentialRampToValueAtTime(.0001, n + 2.6 + i * .3);
        o.connect(g); g.connect(master); o.start(n); o.stop(n + 3.4);
      });
    },
    /* 无双爆发 */
    musou() {
      if (!ctx) return;
      const o = ctx.createOscillator(); o.type = 'sawtooth';
      const n = t(); o.frequency.setValueAtTime(70, n); o.frequency.exponentialRampToValueAtTime(420, n + .5);
      const f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.setValueAtTime(300, n);
      f.frequency.exponentialRampToValueAtTime(4200, n + .5);
      const g = ctx.createGain(); g.gain.setValueAtTime(.0001, n);
      g.gain.linearRampToValueAtTime(.36, n + .08); g.gain.exponentialRampToValueAtTime(.0001, n + .9);
      o.connect(f); f.connect(g); g.connect(master); o.start(n); o.stop(n + 1);
      noiseHit(.7, 400, 3000, .6, .3);
      for (let i = 0; i < 5; i++) setTimeout(() => api.drum(1), i * 90);
    },
    /* 敌将登场 */
    officer() {
      if (!ctx) return;
      api.gong();
      setTimeout(() => api.drum(1.2), 120);
      setTimeout(() => api.drum(1.0), 380);
      setTimeout(() => api.drum(1.3), 520);
    },
    /* 玩家受击 */
    hurt() {
      if (!ctx) return;
      noiseHit(.14, 900, 160, .6, .5);
      tone(64, .22, 'sine', .6, .5);
    },
    /* 闪避 */
    dash() { if (ctx) noiseHit(.26, 320, 1800, .9, .22); },
    /* 脚步 */
    step() { if (ctx) noiseHit(.07, 420, 140, .9, .12, 'lowpass'); },
    /* 弓弦 */
    bow() {
      if (!ctx) return;
      noiseHit(.1, 3000, 700, 2.5, .25);
      tone(180, .12, 'triangle', .12, .6);
    },
    /* 兵卒溃退 */
    rout() { if (ctx) { noiseHit(.5, 700, 200, .5, .2); tone(120, .5, 'sawtooth', .08, .6); } }
  };

  /* 战鼓配乐：固定节奏型，用 lookahead 调度 */
  const PAT = [1, 0, .5, 0, .8, 0, .45, .6];
  let beat = 0, nextT = 0, timer = null, bpm = 92;
  function schedule() {
    if (!ctx) return;
    while (nextT < ctx.currentTime + 0.4) {
      const v = PAT[beat % PAT.length];
      if (v > 0) {
        const o = ctx.createOscillator(); o.type = 'sine';
        const n = nextT; o.frequency.setValueAtTime(v > .7 ? 160 : 130, n);
        o.frequency.exponentialRampToValueAtTime(44, n + .24);
        const g = ctx.createGain(); g.gain.setValueAtTime(.0001, n);
        g.gain.linearRampToValueAtTime(.42 * v, n + .006); g.gain.exponentialRampToValueAtTime(.0001, n + .36);
        o.connect(g); g.connect(musicGain); o.start(n); o.stop(n + .42);
        if (v > .7) {
          const s = ctx.createBufferSource(); s.buffer = noise; s.loop = true;
          const f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1500; f.Q.value = .8;
          const g2 = ctx.createGain(); g2.gain.setValueAtTime(.0001, n);
          g2.gain.linearRampToValueAtTime(.08, n + .004); g2.gain.exponentialRampToValueAtTime(.0001, n + .09);
          s.connect(f); f.connect(g2); g2.connect(musicGain); s.start(n); s.stop(n + .12);
        }
      }
      nextT += 60 / bpm / 2; beat++;
    }
  }
  api.startMusic = () => {
    if (!ctx || timer) return;
    nextT = ctx.currentTime + .1;
    timer = setInterval(schedule, 120);
  };
  api.stopMusic = () => { if (timer) { clearInterval(timer); timer = null; } };
  api.setIntensity = v => { bpm = 88 + v * 26; };
  return api;
})();

const PMAX = 1600;
const pPos = new Float32Array(PMAX * 3);
const pCol = new Float32Array(PMAX * 3);
const pSize = new Float32Array(PMAX);
const pAlpha = new Float32Array(PMAX);
const pVel = new Float32Array(PMAX * 3);
const pLife = new Float32Array(PMAX);
const pMax = new Float32Array(PMAX);
const pGrav = new Float32Array(PMAX);
const pDrag = new Float32Array(PMAX);
let pSlot = 0;

const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('aColor', new THREE.BufferAttribute(pCol, 3));
pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1));
pGeo.setAttribute('aAlpha', new THREE.BufferAttribute(pAlpha, 1));
const pMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.NormalBlending,
  uniforms: { uTex: { value: TEX_DOT } },
  vertexShader: `
    attribute vec3 aColor; attribute float aSize; attribute float aAlpha;
    varying vec3 vC; varying float vA;
    void main(){
      vC = aColor; vA = aAlpha;
      vec4 mv = modelViewMatrix * vec4(position,1.);
      gl_Position = projectionMatrix * mv;
      gl_PointSize = aSize * 420.0 / max(-mv.z, 1.0);
    }`,
  fragmentShader: `
    uniform sampler2D uTex; varying vec3 vC; varying float vA;
    void main(){
      vec4 t = texture2D(uTex, gl_PointCoord);
      if (t.a * vA < 0.004) discard;
      gl_FragColor = vec4(vC, t.a * vA);
    }`
});
const points = new THREE.Points(pGeo, pMat);
points.frustumCulled = false;
scene.add(points);

function emit(x, y, z, vx, vy, vz, r, g, b, size, life, grav = 0, drag = 1.6) {
  const i = pSlot; pSlot = (pSlot + 1) % PMAX;
  pPos[i * 3] = x; pPos[i * 3 + 1] = y; pPos[i * 3 + 2] = z;
  pVel[i * 3] = vx; pVel[i * 3 + 1] = vy; pVel[i * 3 + 2] = vz;
  pCol[i * 3] = r; pCol[i * 3 + 1] = g; pCol[i * 3 + 2] = b;
  pSize[i] = size; pLife[i] = life; pMax[i] = life; pGrav[i] = grav; pDrag[i] = drag;
  pAlpha[i] = 1;
}
const _c = new THREE.Color();
function burst(pos, n, opt = {}) {
  const col = _c.set(opt.color ?? 0xffffff);
  const spd = opt.speed ?? 4, up = opt.up ?? 2, life = opt.life ?? .6, size = opt.size ?? .5;
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), e = rand(-1, 1), s = spd * rand(.35, 1);
    const ce = Math.sqrt(1 - e * e);
    emit(pos.x + rand(-.1, .1), pos.y + rand(-.1, .1), pos.z + rand(-.1, .1),
      Math.cos(a) * ce * s, e * s * .6 + up * rand(.4, 1), Math.sin(a) * ce * s,
      col.r * rand(.8, 1.15), col.g * rand(.8, 1.15), col.b * rand(.8, 1.15),
      size * rand(.6, 1.4), life * rand(.6, 1.3), opt.grav ?? -6, opt.drag ?? 2.2);
  }
}
function updateParticles(dt) {
  for (let i = 0; i < PMAX; i++) {
    if (pLife[i] <= 0) { if (pAlpha[i] !== 0) { pAlpha[i] = 0; pSize[i] = 0; } continue; }
    pLife[i] -= dt;
    const k = Math.max(0, pLife[i] / pMax[i]);
    const d = Math.exp(-pDrag[i] * dt);
    pVel[i * 3] *= d; pVel[i * 3 + 2] *= d;
    pVel[i * 3 + 1] = pVel[i * 3 + 1] * d + pGrav[i] * dt;
    pPos[i * 3] += pVel[i * 3] * dt;
    pPos[i * 3 + 1] += pVel[i * 3 + 1] * dt;
    pPos[i * 3 + 2] += pVel[i * 3 + 2] * dt;
    if (pPos[i * 3 + 1] < 0.03) { pPos[i * 3 + 1] = 0.03; pVel[i * 3 + 1] *= -.28; pVel[i * 3] *= .7; pVel[i * 3 + 2] *= .7; }
    pAlpha[i] = k * k;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.aColor.needsUpdate = true;
  pGeo.attributes.aSize.needsUpdate = true;
  pGeo.attributes.aAlpha.needsUpdate = true;
}

}

/* base64 → BufferGeometry（nv,ni:u32 | pos:f32 | col:u8x4 | idx:u16） */
function decodeParts(src) {
  const out = {};
  for (const k in src) {
    const bin = Uint8Array.from(atob(src[k]), c => c.charCodeAt(0));
    const dv = new DataView(bin.buffer);
    const nv = dv.getUint32(0, true), ni = dv.getUint32(4, true);
    let o = 8;
    const pos = new Float32Array(nv * 3);
    for (let i = 0; i < nv * 3; i++) { pos[i] = dv.getFloat32(o, true); o += 4; }
    const col = new Uint8Array(nv * 4);
    col.set(bin.subarray(o, o + nv * 4)); o += nv * 4;
    const idx = new Uint16Array(ni * 3);
    for (let i = 0; i < ni * 3; i++) { idx[i] = dv.getUint16(o, true); o += 2; }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 4, true));
    g.setIndex(new THREE.BufferAttribute(idx, 1));
    g.computeVertexNormals();
    g.computeBoundingSphere();
    out[k] = g;
  }
  return out;

/* ---------------- 敌兵 AI ---------------- */
let attackTokens = 0;
const MAX_TOKENS = 2;

function updateEnemies(dt) {
  const px = player.pos.x, pz = player.pos.z;
  for (let i = 0; i < MAXE; i++) {
    const s = E[i];
    if (!s.active) continue;
    s.flash = Math.max(0, s.flash - dt * 6);

    if (s.dead) {
      s.deadT += dt;
      s.tilt = damp(s.tilt, -Math.PI * 0.48, 7, dt);
      s.pos.y = damp(s.pos.y, 0.12, 6, dt);
      if (s.deadT > 3.2) { s.active = false; }
      continue;
    }

    const dx = px - s.pos.x, dz = pz - s.pos.z;
    const dist = Math.hypot(dx, dz) || 0.0001;
    const nx = dx / dist, nz = dz / dist;

    s.cool -= dt;
    s.t += dt;

    /* 攻击状态机 */
    if (s.state === 'wind') {
      s.atkP = clamp(s.t / (TYPES[s.type].wind * (s.officer ? .8 : 1)), 0, 1);
      s.yaw = angTo(s.yaw, Math.atan2(nx, nz), dt * 6);
      if (s.atkP >= 1) {
        s.state = 'strike'; s.t = 0;
        if (s.type === 'archer') shootArrow(s, nx, nz);
        else {
          SFX.swing(false);
          const reach = s.reach * (s.officer ? 1.35 : 1);
          if (dist < reach + 0.55 && Math.abs(angDiff(Math.atan2(nx, nz), s.yaw)) < 1.15) {
            damagePlayer(s.dmg * (s.officer ? 1.7 : 1), nx, nz);
          }
        }
      }
    } else if (s.state === 'strike') {
      const dur = TYPES[s.type].strike;
      s.atkP = 1 - clamp(s.t / dur, 0, 1) * .35;
      if (s.t >= dur) { s.state = 'rec'; s.t = 0; }
    } else if (s.state === 'rec') {
      if (s.t >= TYPES[s.type].rec) {
        s.state = 'chase'; s.t = 0; s.cool = rand(.5, 1.6);
        if (!s.officer) attackTokens = Math.max(0, attackTokens - 1);
      }
    } else if (s.state === 'stagger') {
      if (s.t > 0.34) { s.state = 'chase'; s.t = 0; s.cool = Math.max(s.cool, .25); }
    } else {
      /* chase */
      let mvx = 0, mvz = 0;
      if (s.type === 'archer') {
        const want = 12;
        if (dist > want + 2) { mvx = nx; mvz = nz; }
        else if (dist < want - 3) { mvx = -nx; mvz = -nz; }
        else { mvx = -nz * s.strafe * .8; mvz = nx * s.strafe * .8; }
        if (s.cool <= 0 && dist < s.range && dist > 4) {
          s.state = 'wind'; s.t = 0; s.cool = rand(1.8, 3.4);
        }
      } else {
        if (dist > s.range * .82) { mvx = nx; mvz = nz; }
        else {
          s.strafeT -= dt;
          if (s.strafeT <= 0) { s.strafeT = rand(.6, 1.6); s.strafe *= -1; }
          mvx = -nz * s.strafe * .45; mvz = nx * s.strafe * .45;
          if (s.cool <= 0 && attackTokens < MAX_TOKENS) {
            s.state = 'wind'; s.t = 0; attackTokens++;
            s.cool = rand(1.4, 2.8);
          }
        }
      }

      const ml = Math.hypot(mvx, mvz);
      if (ml > 0.01) {
        const sp = s.spd * (dist > 6 ? 1.15 : 1);
        s.pos.x += (mvx / ml) * sp * dt;
        s.pos.z += (mvz / ml) * sp * dt;
        s.phase += dt * sp * 2.1;
      } else {
        s.phase += dt * 1.2;
      }
      s.yaw = angTo(s.yaw, Math.atan2(nx, nz), dt * 7);
    }

    /* 分离力 */
    for (let j = i + 1; j < MAXE; j++) {
      const o = E[j];
      if (!o.active || o.dead) continue;
      const ddx = o.pos.x - s.pos.x, ddz = o.pos.z - s.pos.z;
      const d2 = ddx * ddx + ddz * ddz;
      const minD = (s.scale + o.scale) * 0.52;
      if (d2 < minD * minD && d2 > 0.0001) {
        const d = Math.sqrt(d2), push = (minD - d) / d * 0.5;
        s.pos.x -= ddx * push; s.pos.z -= ddz * push;
        o.pos.x += ddx * push; o.pos.z += ddz * push;
      }
    }

    /* 贴身 Too close: 微微推开，避免糊住镜头 */
    if (dist < 2.6 && !s.officer) {
      s.pos.x -= nx * (2.6 - dist) * 0.6;
      s.pos.z -= nz * (2.6 - dist) * 0.6;
    }

    /* 战场边界 */
    const r = Math.hypot(s.pos.x, s.pos.z);
    const lim = GROUND_R - 6;
    if (r > lim) { s.pos.x *= lim / r; s.pos.z *= lim / r; }
    s.pos.y = damp(s.pos.y, 0, 8, dt);
  }
}

];
function sampleKeys(keys, p) {
  let a = keys[0], b = keys[keys.length - 1];
  for (let i = 0; i < keys.length - 1; i++) {
    if (p >= keys[i][0] && p <= keys[i + 1][0]) { a = keys[i]; b = keys[i + 1]; break; }
  }
  const span = Math.max(1e-5, b[0] - a[0]);
  const t = smooth(clamp((p - a[0]) / span, 0, 1));
  return [0, 1, 2, 3, 4, 5].map(i => lerp(a[i + 1] ?? 0, b[i + 1] ?? 0, t));
}

const keys = Object.create(null);

function startAttack(stage, dur, heavy) {
  player.state = 'attack'; player.atkStage = stage; player.t = 0;
  player.atkDur = dur; player.atkDone = false;
  player.atk = { stage, heavy, hit: new Set() };

function updatePlayer(dt) {
  if (player.dead) { player.t += dt; playRig(heroRig,'die'); advanceRig(heroRig,dt,0); return; }
  player.t += dt;
  if(player.state==='attack')advanceRig(heroRig,dt,0);
  player.comboT -= dt; if (player.comboT <= 0) player.combo = 0;
  player.dashCd = Math.max(0, player.dashCd - dt);
  player.invuln = Math.max(0, player.invuln - dt);
  player.hurtT = Math.max(0, player.hurtT - dt);

  /* ---- 移动 ---- */
  let ix = 0, iz = 0;
  if (keys['w']) iz -= 1; if (keys['s']) iz += 1;
  if (keys['a']) ix -= 1; if (keys['d']) ix += 1;
  const il = Math.hypot(ix, iz);
  player.moving = il > 0.01 && player.state !== 'attack' && player.state !== 'dash';

  const canMove = player.state !== 'attack' && player.hurtT <= 0;
  if (il > 0.01 && canMove) {
    ix /= il; iz /= il;
    const cy = camYaw;
    const wx = ix * Math.cos(cy) + iz * Math.sin(cy);
    const wz = -ix * Math.sin(cy) + iz * Math.cos(cy);
    const sp = player.speed * (keys['shift'] ? player.sprintMul : 1) * (player.state === 'musou' ? .35 : 1);
    player.vel.x = damp(player.vel.x, wx * sp, 12, dt);
    player.vel.z = damp(player.vel.z, wz * sp, 12, dt);
    if (player.state !== 'attack' && player.state !== 'musou')
      player.yaw = angTo(player.yaw, Math.atan2(wx, wz), dt * 12);
    player.walkP += dt * (keys['shift'] ? 13 : 9);
    player.stepT -= dt * (keys['shift'] ? 1.7 : 1.2);
    if (player.stepT <= 0) { player.stepT = 0.3; SFX.step(); }
  } else {
    player.vel.x = damp(player.vel.x, 0, 14, dt);
    player.vel.z = damp(player.vel.z, 0, 14, dt);
  }

  /* 闪避 */
  if (player.dashT > 0) {
    player.dashT -= dt;
    player.vel.x = Math.sin(player.yaw) * 17 * (player.dashT / 0.22 + .3);
    player.vel.z = Math.cos(player.yaw) * 17 * (player.dashT / 0.22 + .3);
    player.invuln = Math.max(player.invuln, 0.05);
  }

  player.pos.x += player.vel.x * dt;
  player.pos.z += player.vel.z * dt;
  const pr = Math.hypot(player.pos.x, player.pos.z), plim = GROUND_R - 5;
  if (pr > plim) { player.pos.x *= plim / pr; player.pos.z *= plim / pr; }

  /* ---- 攻击状态 ---- */
  if (player.state === 'attack') {
    player.atkP = clamp(player.t / player.atkDur, 0, 1);
    const hitAction=heroRig.actions[player.atk.heavy?'heavy':'atk'+(player.atkStage+1)];
    const clipHit=hitAction?.getClip().userData.hit;
    const reachedHit=hitAction&&clipHit!==null?hitAction.time>clipHit:player.atkP>(player.atk.heavy?.46:.40);
    if (!player.atkDone && reachedHit) {
      player.atkDone = true;
      resolvePlayerHit(player.atk);
    }
    if (player.atkP >= 1) { player.state = 'idle'; player.atk = null; }
  }
  if (player.state === 'musou') {
    player.musouT -= dt;
    if (Math.random() < dt * 40) {
      const a = rand(0, TAU), r = rand(1, 4.4);
      burst(_v3.set(player.pos.x + Math.cos(a) * r, rand(.2, 2), player.pos.z + Math.sin(a) * r), 3,
        { color: 0x9fd8ff, speed: 3, up: 3, life: .5, size: .55, grav: -2 });
    }
    if (player.musouT <= 0) { player.state = 'idle'; }
  }

  /* ---- 模型动画 ---- */
  const runK = clamp(Math.hypot(player.vel.x, player.vel.z) / player.speed, 0, 1.3);
  const w = Math.sin(player.walkP);
  let armRx = 0, armRz = .15, twist = 0, lean = 0, hipY = 0;
  let legL = 0, legR = 0, armLx = 0;

  if (player.state === 'attack' && player.atk) {
    const p = player.atk.heavy ? player.atkP : player.atkP;
    const k = sampleKeys(ATK_KEYS[player.atkStage] || ATK_KEYS[0], p);
    armRx = k[0]; armRz = k[1]; twist = k[2]; lean = k[3]; hipY = k[4];
    legL = -0.18; legR = 0.22;
    if (player.atk.heavy) { armRx *= 1.12; twist *= 1.25; }
  } else if (player.state === 'musou') {
    armRx = -0.15 + Math.sin(performance.now() * 0.03) * .2;
    armRz = 1.35; twist = 0; lean = 0.05; hipY = -0.05;
  } else if (player.hurtT > 0) {
    lean = -0.3; armLx = -0.9; armRx = -0.5;
  } else {
    armRx = -0.55 + w * .28 * runK;
    armRz = .28; armLx = w * .55 * runK;
    lean = runK * .16; hipY = -Math.abs(w) * .04 * runK + Math.sin(performance.now() * .002) * .008;
    legL = w * .78 * runK; legR = -w * .78 * runK;
  }

  player3.position.copy(player.pos);
  player3.scale.setScalar(1.16);
  pRoot.rotation.y = player.yaw;
  pHips.position.y = 0.95 + hipY;
  pTorso.rotation.set(lean, twist, 0);
  pArmR.rotation.set(armRx, 0, armRz);
  pArmL.rotation.set(armLx, 0, -0.12);
  pLegL.rotation.x = legL; pLegR.rotation.x = legR;
  pHead.rotation.set(-lean * .6, -twist * .5, 0);
  pSpear.rotation.x = damp(pSpear.rotation.x, 1.15 + (player.state === 'attack' ? -0.95 : 0), 18, 1 / 60);

  /* 披风 */
  {
    const arr = capeGeo.attributes.position.array;
    const spd = clamp(Math.hypot(player.vel.x, player.vel.z) / 8, 0, 1);
    for (let i = 0; i < arr.length; i += 3) {
      const bx = capeBase[i], by = capeBase[i + 1];
      const k = (0.56 - by) / 1.12;
      arr[i + 2] = capeBase[i + 2] - k * k * (0.25 + spd * 0.55) + Math.sin(performance.now() * .006 + by * 5) * .035 * k;
      arr[i] = bx * (1 + k * spd * .18);
    }
    capeGeo.attributes.position.needsUpdate = true;
    capeGeo.computeVertexNormals();
  }

  pShadow.position.set(player.pos.x, 0.03, player.pos.z);
  pRing.position.set(player.pos.x, 0.05, player.pos.z);
  pRing.rotation.z += 0.01;
  pRing.material.opacity = 0.18 + Math.sin(performance.now() * 0.003) * 0.06;
  player3.visible = !player.dead || player.t % 0.2 < 0.14;
  heroRig.mesh.rotation.y=player.yaw;
  const heroClip=player.dead?'die':player.state==='musou'?'musou':player.state==='attack'?(player.atk?.heavy?'heavy':'atk'+(player.atkStage+1)):player.hurtT>0?'hit':player.moving?(keys.shift?'run':'walk'):'idle';
  playRig(heroRig,heroClip,player.state==='attack'?player.atkDur:undefined);
  if(player.state!=='attack')advanceRig(heroRig,dt,0);
  heroRig.mesh.material.userData.wear.value=(1-player.hp/player.maxhp)*.55;

}

/* ---------------- 命中判定 ---------------- */
function resolvePlayerHit(atk) {
  const heavy = atk.heavy;
  const stage = atk.stage;
  const range = heavy ? 4.3 : (stage === 2 ? 3.9 : 3.6);
  const halfArc = heavy ? 1.75 : (stage === 2 ? 1.15 : 1.35);
  const dmg = (heavy ? 62 : [20, 22, 34][stage] || 20) * (atk.power || 1);
  const px = player.pos.x, pz = player.pos.z;
  let hits = 0;

  for (const s of E) {
    if (!s.active || s.dead) continue;
    const dx = s.pos.x - px, dz = s.pos.z - pz;
    const d = Math.hypot(dx, dz);
    if (d > range + s.scale * 0.45) continue;
    if (Math.abs(angDiff(Math.atan2(dx, dz), player.yaw)) > halfArc) continue;
    const nx = dx / (d || 1), nz = dz / (d || 1);
    damageEnemy(s, dmg * rand(.92, 1.08), nx, nz, heavy || stage === 2);
    hits++;
    if (hits > 14) break;
  }
  if (hits > 0) {
    if (heavy) { shockRing(player.pos, 5.5, .45, 0xffe0a0); shake(.4, .3); SFX.thud(); }
    SFX.clang();
  }
}

/* ---------------- 玩家受击 / 无双 ---------------- */
function damagePlayer(dmg, nx, nz) {
  if (player.invuln > 0 || player.dead || player.state === 'musou') return;
  player.hp -= dmg;
  player.hurtT = 0.32; player.invuln = 0.8;
  if (player.state !== 'musou') player.musou = clamp(player.musou + 5, 0, player.maxMusou);
  player.combo = 0;
  SFX.hurt();
  shake(.42, .28);
  hitStop = Math.max(hitStop, .05);
  burst(_v3.copy(player.pos).setY(1.2), 8, { color: 0xc03024, speed: 4, up: 2, life: .5, size: .34, grav: -10 });
  popDamage(_v3.copy(player.pos).setY(1.9), '-' + Math.round(dmg), 'player');
  flashHurt();
  if (player.hp <= 0) { player.hp = 0; playerDie(); }
}

function playerDie() {
  player.dead = true; player.state = 'dead'; player.t = 0;

function activateMusou() {

    for (const s of E) {

      const dx = s.pos.x - player.pos.x, dz = s.pos.z - player.pos.z;
      if (dx * dx + dz * dz < 25) {

}

{

   9. 镜头 / 输入
   ============================================================ */
let camYaw = 0, camPitch = 0.24, camDist = 7.0;
const camTarget = new THREE.Vector3();
const camPos = new THREE.Vector3();
const SENS = 0.0026;
let pointerLocked = false;

function updateCamera(dt) {
  const p = player.pos;
  camTarget.set(p.x, 1.55, p.z);

  /* 锁定 */
  if (player.lock && (!player.lock.active || player.lock.dead)) player.lock = null;
  if (player.lock) {
    const dx = player.lock.pos.x - p.x, dz = player.lock.pos.z - p.z;
    const want = Math.atan2(-dx, -dz);
    camYaw = camYaw + angDiff(want, camYaw) * Math.min(1, dt * 4.5);
  }

  const cp = Math.cos(camPitch), sp = Math.sin(camPitch);
  const wantDist = camDist + (player.state === 'musou' ? 2.2 : 0) + (keys['shift'] && player.moving ? 0.7 : 0);
  const shX = Math.cos(camYaw) * 0.55, shZ = -Math.sin(camYaw) * 0.55;
  camPos.set(
    camTarget.x + Math.sin(camYaw) * cp * wantDist + shX,
    camTarget.y + sp * wantDist + 0.55,
    camTarget.z + Math.cos(camYaw) * cp * wantDist + shZ
  );
  if (camPos.y < 0.7) camPos.y = 0.7;

  camera.position.lerp(camPos, 1 - Math.exp(-12 * dt));

  const shakeAmt = shakeT > 0 ? shakeMag * (shakeT / 0.3) : 0;
  camera.lookAt(camTarget);
  if (shakeAmt > 0.001) {
    camera.position.x += rand(-1, 1) * shakeAmt * .35;
    camera.position.y += rand(-1, 1) * shakeAmt * .35;
    camera.rotation.z += rand(-1, 1) * shakeAmt * .035;
  }
  shakeT = Math.max(0, shakeT - dt);
  if (shakeT <= 0) shakeMag = 0;
  camera.fov = damp(camera.fov, player.state === 'musou' ? 66 : (player.moving && keys['shift'] ? 63 : 58), 6, dt);
  camera.updateProjectionMatrix();
}

/* ---------------- 输入 ---------------- */
let chain = 0, chainT = 0;

function tryLight() {
  if (G.state !== 'play' || player.dead) return;
  if (player.state === 'attack') { if (player.atkP > 0.2) player.queued = true; return; }
  if (player.state === 'musou' || player.hurtT > 0) return;
  if (chainT <= 0) chain = 0;
  startAttack(chain, 0.40, false);
  player.atk.power = 1;
  chain = (chain + 1) % 3; chainT = 0.85;
}
function releaseHeavy() {
  if (G.state !== 'play' || player.dead) return;
  if (player.state !== 'idle' && player.state !== 'run') { player.charging = false; return; }
  const pw = 0.65 + clamp(player.chargeT / 1.15, 0, 1) * 0.85;
  startAttack(0, 0.60, true);
  player.atk.power = pw;
  player.charging = false; player.chargeT = 0;
  if (pw > 1.2) { shake(.3, .3); shockRing(player.pos, 4, .4, 0xffd9a0); }
}
function tryDash() {
  if (player.dashCd > 0 || player.dead || player.state === 'attack' || player.hurtT > 0) return;
  player.dashT = 0.22; player.dashCd = 0.55;
  SFX.dash();
  burst(_v3.copy(player.pos).setY(.2), 8, { color: 0xbfae8e, speed: 3, up: 1.2, life: .5, size: .6, grav: -2, drag: 3 });
}
function lockPointer() {
  try { const p = canvas.requestPointerLock(); if (p && p.catch) p.catch(() => {}); } catch (e) { /* 忽略 */ }
}
function tryLock() {
  let best = null, bd = 24;
  for (const s of E) {
    if (!s.active || s.dead) continue;
    const d = Math.hypot(s.pos.x - player.pos.x, s.pos.z - player.pos.z);
    if (d < bd) { bd = d; best = s; }
  }
  player.lock = (player.lock === best) ? null : best;
}

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true;
  if (k === ' ') { e.preventDefault(); tryDash(); }
  if (k === 'j') tryLight();
  if (k === 'k') { if (!e.repeat) { player.charging = true; player.chargeT = 0; } }
  if (k === 'f') activateMusou();
  if (k === 'tab') { e.preventDefault(); tryLock(); }
  if (k === 'escape') { if (document.pointerLockElement) document.exitPointerLock(); }
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  keys[k] = false;
  if (k === 'k' && player.charging) releaseHeavy();
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

let dragging = false;
canvas.addEventListener('mousedown', e => {
  if (G.state !== 'play') return;
  if (!document.pointerLockElement) { lockPointer(); dragging = true; }
  if (e.button === 0) tryLight();
  if (e.button === 2) { player.charging = true; player.chargeT = 0; }
});
addEventListener('mouseup', e => {
  dragging = false;
  if (e.button === 2 && player.charging) releaseHeavy();
});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('mousemove', e => {
  if (!pointerLocked && !dragging) return;
  camYaw -= (e.movementX || 0) * SENS;
  camPitch = clamp(camPitch + (e.movementY || 0) * SENS, -0.18, 0.95);
});
document.addEventListener('pointerlockchange', () => {
  pointerLocked = document.pointerLockElement === canvas;
});

def analyze_shots(shots):
    """用像素指标代替人眼：地面平铺（高通自相关峰值）、细节量（边缘密度）。"""
    try:
        import io
        import numpy as np
        from PIL import Image, ImageFilter
    except Exception as exc:  # pragma: no cover
        return {"error": f"numpy/Pillow 不可用: {exc}"}

    metrics = {}
    for name in ("combat.jpg", "boss2.jpg"):
        if name not in shots:
            continue
        img = Image.open(io.BytesIO(shots[name]["image"])).convert("L")
        a = np.asarray(img).astype(np.float32)
        h, w = a.shape
        roi = a[int(h * 0.62):int(h * 0.92), int(w * 0.28):int(w * 0.72)]
        blur = np.asarray(Image.fromarray(roi.astype(np.uint8))
                          .filter(ImageFilter.GaussianBlur(9))).astype(np.float32)
        hp = roi - blur
        hp = hp - hp.mean()
        F = np.fft.fft2(hp)
        ac = np.fft.ifft2(F * np.conj(F)).real
        ac = ac / max(float(ac[0, 0]), 1e-6)
        peak = max(float(ac[dy, dx]) for dy in range(20, 160, 2) for dx in range(20, 160, 2))
        gy, gx = np.gradient(roi)
        metrics[name] = {"tilingPeak": round(peak, 3),
                         "edgeDensity": round(float(np.abs(gx).mean() + np.abs(gy).mean()), 2),
                         "roiStd": round(float(roi.std()), 2)}
    return metrics
